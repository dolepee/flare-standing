name: Coston2 Keeper

permissions: {}

on:
  schedule:
    - cron: '*/5 * * * *'

concurrency:
  group: standing-coston2-keeper
  # Preserve every actual invocation ordinal. The default single pending slot
  # replaces older queued runs and can therefore drop a keeper page.
  queue: max

jobs:
  charge-due-mandates:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    defaults:
      run:
        working-directory: tools/keeper
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/keeper/package-lock.json
      - run: npm ci --omit=dev
      - name: Validate exact keeper mandate allowlist
        env:
          # Pin the durable judge mandate in reviewed workflow code. A mutable
          # repository variable cannot opt the historical fast-cadence proof in.
          KEEPER_MANDATE_IDS: '2'
        run: node --input-type=module -e "import { parseHostedKeeperMandateIds } from './src/keeper.mjs'; parseHostedKeeperMandateIds(process.env.KEEPER_MANDATE_IDS)"
      - name: Charge due Coston2 mandates
        env:
          COSTON2_RPC: https://coston2-api.flare.network/ext/C/rpc
          STANDING_ADDRESS: ${{ vars.STANDING_ADDRESS }}
          KEEPER_MANDATE_IDS: '2'
          KEEPER_PRIVATE_KEY: ${{ secrets.COSTON2_KEEPER_PRIVATE_KEY }}
          # A workflow invocation ordinal, unlike wall-clock time, advances once
          # per actual run even when best-effort schedules are delayed or missed.
          KEEPER_SCAN_CURSOR: ${{ github.run_number }}
        # runKeeper admits at most 10s + (5 mandates * 30s) = 160s.
        # The process watchdog leaves 20s for orderly failure, then a 10s hard-stop;
        # the six-minute job limit also leaves setup/install headroom.
        run: timeout --signal=TERM --kill-after=10s 180s node src/keeper.mjs
